name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate schema
        run: npm run generate-schema

      - name: Check schema drift
        run: |
          git diff --exit-code schemas/claude-event.v1.schema.json || (
            echo "❌ Schema has drifted from src/events/types.ts"
            echo "Run 'npm run generate-schema' to regenerate"
            exit 1
          )

      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: pip

      - name: Generate Python models
        run: |
          cd py-code-wrapper
          pip install -e ".[dev]"
          python scripts/generate_models.py

      - name: Check Python models drift
        run: |
          cd py-code-wrapper
          git diff --exit-code src/code_wrapper/models.py || (
            echo "❌ Python models have drifted from schema"
            echo "Run 'python scripts/generate_models.py' to regenerate"
            exit 1
          )

  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:live
