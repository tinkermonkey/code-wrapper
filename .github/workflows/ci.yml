name: CI

on:
  pull_request:
  push:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python-models: ${{ steps.filter.outputs.python-models }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python-models:
              - 'src/events/**'
              - 'schemas/**'
              - 'py-code-wrapper/scripts/generate_models.py'
              - 'py-code-wrapper/pyproject.toml'
              - 'py-code-wrapper/src/code_wrapper/models.py'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate schema
        run: npm run generate-schema

      - name: Check schema drift
        run: |
          git diff --exit-code schemas/claude-event.v1.schema.json || (
            echo "❌ Schema has drifted from src/events/types.ts"
            echo "Run 'npm run generate-schema' to regenerate"
            exit 1
          )

      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Generation happens on a developer's machine, using the exact-pinned
      # `codegen` extra (see py-code-wrapper/pyproject.toml) so local runs
      # and this check produce identical bytes. This job never generates
      # models as its own source of truth — it only verifies that whoever
      # last touched the schema/types also regenerated and committed
      # src/code_wrapper/models.py. Only runs when files that can affect
      # that output actually changed (see the `changes` job above).
      - if: needs.changes.outputs.python-models == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Verify Python models are up to date
        if: needs.changes.outputs.python-models == 'true'
        run: |
          cd py-code-wrapper
          pip install -e ".[codegen]"
          python scripts/generate_models.py
          git diff --exit-code src/code_wrapper/models.py || (
            echo "❌ Python models have drifted from schema"
            echo "Run 'pip install -e \".[codegen]\"' then 'python scripts/generate_models.py' locally, then commit the result"
            exit 1
          )

  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:live
