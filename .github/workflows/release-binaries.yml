name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            outfile: code-wrapper-linux-x64
          - target: bun-linux-arm64
            outfile: code-wrapper-linux-arm64
          - target: bun-darwin-x64
            outfile: code-wrapper-darwin-x64
            runner: macos-latest
          - target: bun-darwin-arm64
            outfile: code-wrapper-darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary for ${{ matrix.target }}
        run: |
          bun build --compile --target=${{ matrix.target }} src/cli/exec.ts --outfile dist/${{ matrix.outfile }}
          chmod +x dist/${{ matrix.outfile }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.outfile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
