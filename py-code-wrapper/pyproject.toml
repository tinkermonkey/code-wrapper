[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Binary download happens in setup.py before setup() is called
# This ensures binaries from GitHub Releases are included in the built wheel

[project]
name = "py-code-wrapper"
version = "0.1.0"
description = "Python async client for code-wrapper binary"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Tinker Monkey", email = "tinker@example.com"}]
keywords = ["claude", "code-wrapper", "async", "ndjson"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
]
# Exact-pinned toolchain for regenerating src/code_wrapper/models.py from the
# JSON schema. Every package here can change the bytes of the generated
# output (directly, or via a formatter/template it drives), so all of them
# are pinned exactly rather than left as floating minimums. This is what
# `scripts/generate_models.py` requires; install it locally before running
# that script, the same way CI does when it verifies the generated file is
# still up to date.
codegen = [
    "datamodel-code-generator==0.45.0",
    "black==26.5.1",
    "isort==7.0.0",
    "Jinja2==3.1.6",
    "inflect==7.5.0",
]

[project.urls]
Homepage = "https://github.com/tinkermonkey/code-wrapper"
Documentation = "https://github.com/tinkermonkey/code-wrapper"
Repository = "https://github.com/tinkermonkey/code-wrapper.git"
Issues = "https://github.com/tinkermonkey/code-wrapper/issues"

[tool.setuptools]
packages = ["code_wrapper"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
code_wrapper = [
    "binaries/*",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
